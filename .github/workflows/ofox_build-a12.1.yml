# OrangeFox Build - fle from brigudav -- Thanks man!
name: OrangeFox Build Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest'
        required: true
        default: ''
        type: choice
        options:
        - https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1' # Branch 11 and 12.1's lunch command doesn't work using this action builder.
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/lopestom/twrp_device_ulefone_Armor_26_Ultra'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/ulefone/Armor_26_Ultra'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'Armor_26_Ultra'
      MAKEFILE_NAME:
        description: 'Specify your twrp/omni_codename'
        required: true
        default: 'twrp_Armor_26_Ultra'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-20.04
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Set Current Date
      id: today
      run: |
        echo "date=$(TZ=Curitiba/Brazil date +%Y%m%d-%l:%M%p)" >> $GITHUB_OUTPUT
        
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
      
    - name: Build Environment
      run: |
        export HOME=${GITHUB_WORKSPACE}
        cd ${GITHUB_WORKSPACE}
        sudo apt install git aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sudo bash setup/install_android_sdk.sh || true

    - name: Install Git-Repo
      run: |
        git config --global advice.detachedHead false
        git clone https://android.googlesource.com/tools/repo -b v2.29 ~/bin
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set-up Manifest
      run: |
        mkdir ${GITHUB_WORKSPACE}/OrangeFox_sync
        cd ${GITHUB_WORKSPACE}/OrangeFox_sync
        git config --global user.name "lopestom"
        git config --global user.email "guillopes2002@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd ${GITHUB_WORKSPACE}/OrangeFox_sync/sync/
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
       path: fox_${{ github.event.inputs.MANIFEST_BRANCH }}/device/ulefone/Armor_26_Ultra

#    - name: Clone Device Tree
#      run: |
#        cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
#        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        ccache -M 12G
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        source build/envsetup.sh || true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          cp  /home/runner/work/twrp_device_ulefone_Armor_26_Ultra/twrp_device_ulefone_Armor_26_Ultra/fox_12.1/out/target/product/Armor_26_Ultra/boot.img    /home/runner/work/twrp_device_ulefone_Armor_26_Ultra/twrp_device_ulefone_Armor_26_Ultra/fox_12.1/out/target/product/Armor_26_Ultra/OFRP-Armor_26_Ultra-$(date +"%Y%m%d").img
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: fox_${{ github.event.inputs.MANIFEST_BRANCH }} - ${{ steps.today.outputs.date }}
          Device: ${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          Manifest: ${{ github.event.inputs.MANIFEST_URL }}
      env:
        GITHUB_TOKEN: ${{ secrets.TEST }}
